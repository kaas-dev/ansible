---
# Colima VM defaults used by the KaaS CLI
vm_name: kaas
vm_cpus: 4
vm_memory_gib: 8
vm_disk_gib: 64
vm_arch: aarch64
vm_ssh_port: 6022
# Colima/Lima default user is the macOS username
vm_user: "{{ lookup('env', 'USER') }}"
# Shared Lima identity used by Colima profiles
colima_ssh_key: ~/.colima/_lima/_config/user

# Toolchain versions
go_version: "1.26.5"
node_major: "22"
rust_profile: default
python_packages:
  - pip
  - virtualenv
  - setuptools
  - wheel
  - uv

# System packages
apt_packages:
  - build-essential
  - ca-certificates
  - clang
  - cmake
  - curl
  - direnv
  - fd-find
  - fzf
  - git
  - gnupg
  - htop
  - jq
  - libssl-dev
  - lldb
  - make
  - pkg-config
  - protobuf-compiler
  - python3
  - python3-dev
  - python3-pip
  - python3-venv
  - ripgrep
  - software-properties-common
  - tmux
  - unzip
  - wget
  - zip
  - zsh

# Paths — Colima/Lima homes are often /home/<user>.guest, not /home/<user>.
# ansible_facts['user_dir'] is the remote user's real $HOME (requires gather_facts).
home_dir: "{{ ansible_facts['user_dir'] | default(ansible_facts['env']['HOME'] | default('/home/' + (ansible_user | default(vm_user))), true) }}"
bashrc_path: "{{ home_dir }}/.bashrc"
profile_snippet: "{{ home_dir }}/.profile.d/dev-toolchains.sh"
secrets_env_path: "{{ home_dir }}/.profile.d/agent-secrets.sh"

# Sandbox SSH key (pubkey.yml) — used for GitHub and other git remotes
sandbox_ssh_key: "{{ home_dir }}/.ssh/id_ed25519"
sandbox_ssh_key_comment: "{{ vm_name }}"

# Extra tooling (setup.yml) — set to false to skip
install_herdr: true   # herdr — terminal-native coding-agent multiplexer (https://herdr.dev)

# Coding agents (coding-agents.yml) — set any to false to skip
install_pi: true
install_oh_my_pi: true
pi_npm_package: "@earendil-works/pi-coding-agent"

install_prime_agent: true   # Prime Agent (https://github.com/PrimeIntellect-ai/prime-agent)

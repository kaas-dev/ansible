---
# Deploy API keys onto the sandbox VM as shell exports.
# Preferred: kaas secrets deploy <name>  (resolves SecretSpec → temp -e @file)
# Values are supplied by `kaas secrets deploy` from SecretSpec.
- name: Deploy API keys to sandbox
  hosts: colima_vms
  become: false

  tasks:
    - name: Ensure profile.d directory exists
      ansible.builtin.file:
        path: "{{ home_dir }}/.profile.d"
        state: directory
        mode: "0755"

    - name: Collect non-empty known secrets
      ansible.builtin.set_fact:
        secrets_map: >-
          {{
            {
              'ANTHROPIC_API_KEY': anthropic_api_key | default(''),
              'OPENAI_API_KEY': openai_api_key | default(''),
              'GITHUB_TOKEN': github_token | default(''),
              'GH_TOKEN': github_token | default(''),
              'OPENROUTER_API_KEY': openrouter_api_key | default(''),
              'GOOGLE_API_KEY': google_api_key | default(''),
              'DEEPSEEK_API_KEY': deepseek_api_key | default('')
            }
            | combine(extra_env | default({}))
            | dict2items
            | rejectattr('value', 'equalto', '')
            | rejectattr('value', 'none')
            | items2dict
          }}
      no_log: true

    - name: Fail when no secrets provided
      ansible.builtin.fail:
        msg: >-
          No non-empty secrets to deploy. Set values with
          `kaas secrets set KEY [--sandbox {{ inventory_hostname }}]`
          then re-run `kaas secrets deploy`.
      when: (secrets_map | length) == 0

    - name: Write secrets env snippet on VM
      ansible.builtin.copy:
        dest: "{{ secrets_env_path }}"
        mode: "0600"
        content: |
          # Managed by Ansible — from SecretSpec / kaas secrets deploy (do not commit)
          {% for key, value in secrets_map.items() %}
          export {{ key }}={{ value | quote }}
          {% endfor %}
      no_log: true

    - name: Source secrets snippet from .bashrc
      ansible.builtin.blockinfile:
        path: "{{ bashrc_path }}"
        create: true
        marker: "# {mark} ANSIBLE MANAGED AGENT SECRETS"
        block: |
          if [ -f "$HOME/.profile.d/agent-secrets.sh" ]; then
            . "$HOME/.profile.d/agent-secrets.sh"
          fi

    - name: Source secrets snippet from .profile
      ansible.builtin.blockinfile:
        path: "{{ home_dir }}/.profile"
        create: true
        marker: "# {mark} ANSIBLE MANAGED AGENT SECRETS"
        block: |
          if [ -f "$HOME/.profile.d/agent-secrets.sh" ]; then
            . "$HOME/.profile.d/agent-secrets.sh"
          fi

    - name: Report synced secret count
      ansible.builtin.debug:
        msg: "Synced {{ secrets_map | length }} non-empty secret(s) to {{ secrets_env_path }}"
